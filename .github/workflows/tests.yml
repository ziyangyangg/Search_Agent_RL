name: CPU regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test source contracts
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and install the distribution
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install --no-deps "$RUNNER_TEMP"/wheels/search_agent_workbench-*.whl
      - name: Smoke test the installed entry point outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          agent-workbench --help
          agent-workbench demo --workspace "$GITHUB_WORKSPACE/examples/office" --trace "$RUNNER_TEMP/installed-demo.json"
